<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Space Race</title>
</head>
<body class="w3-container">

    <nav>
    <a href="{{ url_for('home') }}" class="w3-bar-item w3-button">Home</a>
    <a href="{{ url_for('about') }}" class="w3-bar-item w3-button">About</a>
    <a href="{{ url_for('credits') }}" class="w3-bar-item w3-button">Credits</a>
  </nav>

  <!-- Header -->
<header class="space w3-container w3-padding-32">
  <h1 class="space w3-text">Space Race</h1>

  <div class="input-container">
   <input type="text" id="rocketSearch" name="rocketSearch" class="rocket-search">
  </div>
</header>

  <!-- Shared Navigation Bar -->
  <nav class="w3-bar nav w3-container">
    <a href="{{ url_for('get_rockets') }}" class="w3-bar-item w3-button">Rockets</a>
    <a href="{{ url_for('get_missions') }}" class="w3-bar-item w3-button">Missions</a>
    <a href="{{ url_for('get_locations') }}" class="w3-bar-item w3-button">Locations</a>
    <a href="{{ url_for('get_joints') }}" class="w3-bar-item w3-button">Mission Overview</a>
    <form>
      <div class="search">
          <input class="search-input" type="search" placeholder="Search">
          <span class="search-icon material-symbols-outlined">search</span>
      </div>
    </form>
  </nav>

  {% block body %}
  {% endblock body %}
  <script src="{{ url_for('static', filename='scripts/app.js') }}"></script>
</body>
</html>
