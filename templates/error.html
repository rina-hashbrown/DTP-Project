<!DOCTYPE html>
<!-- Specifies the language of the document content as English -->
<html lang="en">
<head>
    <!-- Sets the character encoding to UTF-8 for proper text rendering -->
    <meta charset="UTF-8">
    
    <!-- Configures view dimensions and scaling for responsive design across devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Defines the browser tab title for the 404 error page -->
    <title>404 Page Not Found</title> 
    
    <!-- Flask Static Resource: Dynamically links your primary CSS stylesheet from Flask's static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="error-body">
    <!-- Container card to center and style the error page elements -->
    <div class="error-container">
        
        <!-- Main heading displaying the HTTP status code -->
        <h1 id="error-h1">404</h1>
        
        <!-- User-friendly message explaining that the page does not exist -->
        <p id="error-p">
            Woopsies! The page you are looking for isn't here.
        </p>
        
        <!-- Dynamic link using Flask's url_for to direct users back to the home route -->
        <a href="{{ url_for('home') }}" class="w3-bar-item w3-button">Go back to Home!
        </a>
        
    </div>
</body>
</html>
