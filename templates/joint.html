{% extends 'base.html' %}

{% block body %}
<div class="container mt-4">
    <h2>Joint Data</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Rocket ID</th>
                <th>Location ID</th>
                <th>Mission Name</th>
            </tr>
        </thead>
        <tbody>
            {% for joint in joints %}
            <tr>
                <td>{{ joint.rocket_ID }}</td>
                <td>{{ joint.location_ID }}</td>
                <td>{{ joint.mission_name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock body %}
