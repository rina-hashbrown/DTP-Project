{% extends 'base.html' %}

<link rel="stylesheet" href="style.css">
  
{% block body %}

    <div class="input-container">
        <input id="cardSearchInput" type="text" placeholder="Search...">
    </div>

        <h1>Mission Overview</h1>
        <div class="main-joint w3-grid w3-animate-bottom" style= "display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
            {% for joint in joints %}
                <div class="main-joint w3-card-4 w3-center w3-hover-shadow">
                        <div class="detail w3-card-4">
                            <h3>Mission Name: {{ joint.mission_name }}</h3>
                            <p>Rocket ID: {{ joint.rocket_ID }}</p>
                            <p>Location_ID{{ joint.location_ID }}</p>
                        </div>
                </div>
            {% endfor %}
        </div>

    <script>
        let searchInput = document.getElementById('cardSearchInput');
        let cardLinks = document.querySelectorAll('.main-joint');

        if (searchInput) {
        searchInput.addEventListener('keyup', function(event) {
            let searchText = event.target.value.toLowerCase();

            cardLinks.forEach(function(cardLink) {
            let cardText = cardLink.innerText.toLowerCase();

            if (cardText.includes(searchText)) {
                cardLink.style.display = ""; // 
            } else {
                cardLink.style.display = "none"; //
            }
            });
        });
        }
    </script>
    
{% endblock body %}
