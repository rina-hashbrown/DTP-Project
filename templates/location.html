{% extends "base.html" %}

{% block body %}

  <link rel="stylesheet" href="style.css">

  <div class="input-container">
    <input id="cardSearchInput" type="text" placeholder="Search...">
  </div>

    <h1>Launch Sites</h1>
    <div class="w3-panel w3-border-top w3-border-bottom w3-border-green">
      <p>All launch locations from 1960-70. Click on one for more information!</p>
    </div>

  <div class="main-location w3-grid w3-animate-bottom" style= "display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
    {% for location in locations %}
      <a href="{{ url_for('single_location', id=location.location_ID) }}" style="display: block; text-decoration: none; color: inherit;">
        <div class="main-location w3-card-4 w3-center w3-hover-shadow">
          <h3> {{ location.site }}</h3>
        </div>
      </a>
    {% endfor %}
  </div>

  <script>
    let searchInput = document.getElementById('cardSearchInput');
    let cardLinks = document.querySelectorAll('.main-location > a');

    if (searchInput) {
      searchInput.addEventListener('keyup', function(event) {
        let searchText = event.target.value.toLowerCase();

        cardLinks.forEach(function(cardLink) {
          let cardText = cardLink.innerText.toLowerCase();

          if (cardText.includes(searchText)) {
            cardLink.style.display = ""; // 
          } else {
            cardLink.style.display = "none"; //
          }
        });
      });
    }
  </script>

{% endblock body %}
