<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Missions</title>
</head>
<body>
   <nav class="w3-bar nav w3-container">
        <a href="{{ url_for('get_rockets') }}" class="w3-bar-item w3-button">Rockets</a>
        <a href="{{ url_for('get_missions') }}" class="w3-bar-item w3-button">Missions</a>
        <a href="{{ url_for('get_locations') }}" class="w3-bar-item w3-button">Locations</a>
        <a href="{{ url_for('get_joints') }}" class="w3-bar-item w3-button">Mission Overview</a>
        <a href="{{ url_for('home') }}" class="w3-bar-item w3-button">Home</a>
  </nav>
</body>
</html>

<link rel="stylesheet" href="style.css">

{% block body %}

  <div class="input-container">
      <input id="cardSearchInput" type="text" placeholder="Search...">
  </div>

  <h1>Mission Log</h1>
  <p>All mission statistics from 1960-70. Click on one for more information!</p>

  <div class="main-mission w3-grid w3-animate-bottom" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
    {% for mission in missions %}
      <a href="{{ url_for('single_mission', id=mission.mission_ID) }}" style="display: block; text-decoration: none; color: inherit;">
        <div class="main-mission w3-card-4 w3-center w3-hover-shadow">
            <h3>{{ mission.name }}</h3>
        </div>
      </a>
    {% endfor %}
  </div>

  <script>
    let searchInput = document.getElementById('cardSearchInput');
    let cardLinks = document.querySelectorAll('.main-mission > a');

    if (searchInput) {
      searchInput.addEventListener('keyup', function(event) {
        let searchText = event.target.value.toLowerCase();

        cardLinks.forEach(function(cardLink) {
          let cardText = cardLink.innerText.toLowerCase();

          if (cardText.includes(searchText)) {
            cardLink.style.display = ""; // 
          } else {
            cardLink.style.display = "none"; //
          }
        });
      });
    }
  </script>

{% endblock body %}
