{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Rocket Locations</h2>
    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Rocket ID</th>
                <th>Location ID</th>
                <th>Mission Name</th>
            </tr>
        </thead>
        <tbody>
            {% for item in rocket_locations %}
            <tr>
                <td>{{ item.rocket_ID }}</td>
                <td>{{ item.location_ID }}</td>
                <td>{{ item.mission_name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
