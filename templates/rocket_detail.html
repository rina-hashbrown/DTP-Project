<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<link rel="stylesheet" href="style.css">

{% block body %}
  <div class="rocket-detail w3-container w3-animate-left" style="gap: 10px">
    <a href="{{ url_for('get_rockets') }}" class="back-btn">&larr; Back to Roster</a>

    <div class="card-wrapper">
      <div class="detail w3-card-4">
        <h1>{{ rocket.rocket_name }}</h1>
        <p><strong>Rocket ID:</strong> {{ rocket.rocket_ID }}</p>
        <p><strong>Status:</strong> {{ rocket.rocket_status }}</p>
      </div>

      <div class="rocket w3-card-4">
        <img src="{{ url_for('static', filename='images/' ~ rocket.imageURL) }}" alt="{{ rocket.rocket_name }}">
      </div>
    </div>
  </div>
{% endblock body %}
