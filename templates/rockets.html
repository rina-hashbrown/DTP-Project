<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Rockets</title>
</head>

<body>
  <nav class="w3-bar nav w3-container">
        <a href="{{ url_for('get_rockets') }}" class="w3-bar-item w3-button">Rockets</a>
        <a href="{{ url_for('get_missions') }}" class="w3-bar-item w3-button">Missions</a>
        <a href="{{ url_for('get_locations') }}" class="w3-bar-item w3-button">Locations</a>
        <a href="{{ url_for('get_joints') }}" class="w3-bar-item w3-button">Mission Overview</a>
        <a href="{{ url_for('home') }}" class="w3-bar-item w3-button">Home</a>
  </nav>
</body>
</html>
<link rel="stylesheet" href="style.css">

{% block body %}
  <div class="input-container">
      <input id="cardSearchInput" type="text" placeholder="Search...">
  </div>

  <div class="w3-animate-left">
    <h1>Rocket Roster</h1>
  </div>

    <div class="main-rocket w3-grid w3-animate-bottom" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
      {% for rocket in rockets %}
        <a href="{{ url_for('single_rocket', id=rocket.rocket_ID) }}" style="display: block; text-decoration: none; color: inherit;">
          <div class= "main-rocket w3-card-4 w3-center w3-hover-shadow">
            <h3 class="title">{{ rocket.rocket_name }}</h3>
            <p class="contents"> {{ rocket.rocket_ID }} {{ rocket.rocket_status }} </p>
            <img src="{{ url_for('static', filename='images/' ~ rocket.imageURL) }}" alt="{{ rocket.rocket_name }}">
          </div>
        </a>
      {% endfor %}
    </div>

    <div class="w3-panel w3-border-top w3-border-bottom w3-border-green">
    <p>All rockets from 1960-70.</p>
  </div>

  <script>
    let searchInput = document.getElementById('cardSearchInput');
    let cardLinks = document.querySelectorAll('.main-rocket > a');

    if (searchInput) {
      searchInput.addEventListener('keyup', function(event) {
        let searchText = event.target.value.toLowerCase();

        cardLinks.forEach(function(cardLink) {
          let cardText = cardLink.innerText.toLowerCase();

          if (cardText.includes(searchText)) {
            cardLink.style.display = ""; // 
          } else {
            cardLink.style.display = "none"; //
          }
        });
      });
    }
  </script>

{% endblock %}
